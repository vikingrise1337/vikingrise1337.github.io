<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viking Rise News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Roboto:wght@300;400;500&display=swap');
        @font-face { font-family: 'CinzelRus'; src: url('CinzelRus.ttf') format('truetype'); }

        body { font-family: 'Roboto', sans-serif; background-color: #0b101b; color: #e2e8f0; }
        .viking-font { font-family: 'Cinzel', serif; }
        :lang(ru) .viking-font { font-family: 'CinzelRus', serif; }

        /* Glass Card Design */
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        .glass-card:hover { transform: translateY(-5px); border-color: #d4af37; box-shadow: 0 10px 30px -10px rgba(212, 175, 55, 0.2); }

        .promo-box { border: 1px dashed #d4af37; background: rgba(212,175,55,0.1); }

        .lang-btn { cursor: pointer; font-weight: bold; }
        .lang-btn.active { color: #d4af37; text-decoration: underline; text-underline-offset: 4px; }
        .lang-btn.inactive { color: gray; }
        .lang-btn.inactive:hover { color: white; }

        /* Text Begrenzung */
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Links im Text stylen */
        .content-text a {
            color: #d4af37;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s;
        }
        .content-text a:hover {
            border-bottom-color: #d4af37;
            color: white;
        }
    </style>
    <link rel="stylesheet" href="publisher.css?v=3">
    <script src="publisher.js?v=3"></script>
</head>
<body class="min-h-screen pb-20">

    <nav class="w-full z-50 border-b border-white/10 bg-[#0b101b] sticky top-0 backdrop-blur-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 hover:opacity-80">
                <span class="material-symbols-outlined text-gray-400 notranslate">arrow_back</span>
                <span class="viking-font text-lg font-bold text-white">Home</span>
            </a>
            <div class="flex gap-3 text-sm font-bold text-gray-400">
                <span onclick="setLang('en')" id="lang-en" class="lang-btn">EN</span> |
                <span onclick="setLang('de')" id="lang-de" class="lang-btn">DE</span> |
                <span onclick="setLang('cn')" id="lang-cn" class="lang-btn">CN</span> |
                <span onclick="setLang('ru')" id="lang-ru" class="lang-btn">RU</span>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4">
        <section class="vr-notice" id="maintenance-notice" hidden></section>
    </div>
    <div class="container mx-auto px-4 py-12">
        <h1 class="viking-font text-4xl md:text-5xl text-center text-white mb-2">Community <span class="text-[#d4af37]">News</span></h1>
        <p id="sub-title" class="text-center text-gray-400 mb-12">Latest events, codes and announcements.</p>

        <nav class="vr-tabs" id="news-views" aria-label="News">
            <a id="show-news" class="vr-button" href="news.html">News</a>
            <a id="show-gifts" class="vr-button" href="news.html?view=codes">Gift codes</a>
        </nav>
        <section id="gift-board" hidden></section>
        <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-full text-center py-10">
                <span class="material-symbols-outlined text-4xl text-[#d4af37] animate-spin notranslate">refresh</span>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            en: { sub: "Latest events, codes and announcements.", copy: "Copy", copied: "Copied!", readmore: "Read More", showless: "Show Less", expired: "Expired", valid: "Active" },
            de: { sub: "Aktuelle Events, Codes und Ankündigungen.", copy: "Kopieren", copied: "Kopiert!", readmore: "Mehr anzeigen", showless: "Weniger anzeigen", expired: "Abgelaufen", valid: "Aktiv" },
            cn: { sub: "最新活动、代码和公告。", copy: "复制", copied: "已复制!", readmore: "阅读更多", showless: "收起", expired: "已过期", valid: "有效" },
            ru: { sub: "Последние события, коды и анонсы.", copy: "Копировать", copied: "Скопировано!", readmore: "Читать далее", showless: "Свернуть", expired: "Истек", valid: "Активен" }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const showGifts = urlParams.get('view') === 'codes';
        let stopGifts;
        let refreshMaintenance;
        let loadVersion = 0;
        let curLang = urlParams.get('lang') || 'en';
        if(!['en','de','cn','ru'].includes(curLang)) curLang = 'en';

        function updateUI() {
            document.documentElement.lang = curLang === 'cn' ? 'zh-CN' : curLang;
            const text = VikingPublisher.labels[curLang];
            const newsTab = document.getElementById('show-news');
            const giftTab = document.getElementById('show-gifts');
            newsTab.href = `news.html?lang=${curLang}`;
            giftTab.href = `news.html?lang=${curLang}&view=codes`;
            newsTab.textContent = text.news;
            giftTab.textContent = text.codes;
            (showGifts ? giftTab : newsTab).setAttribute('aria-current', 'page');
            document.getElementById('gift-board').setAttribute('aria-label', text.codes);
            document.getElementById('news-grid').hidden = showGifts;
            document.getElementById('gift-board').hidden = !showGifts;
            if (showGifts) document.title = 'Viking Rise · ' + text.codes;
            refreshMaintenance?.();
            ['en','de','cn','ru'].forEach(l => {
                const el = document.getElementById(`lang-${l}`);
                el.className = l === curLang ? "lang-btn active" : "lang-btn inactive";
            });
            document.getElementById('sub-title').innerText = translations[curLang].sub;
        }

        function setLang(lang) {
            curLang = lang;
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', lang);
            window.history.pushState({}, '', newUrl);
            updateUI();
            loadNews();
        }

        const escapeHtml = VikingPublisher.escapeHtml;

        function formatText(text) {
            return String(text || "").split(/(https?:\/\/[^\s<>"']+)/g).map(part => {
                const url = VikingPublisher.safeUrl(part);
                return url
                    ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(part)}</a>`
                    : escapeHtml(part);
            }).join("").replace(/\n/g, '<br>');
        }

        function checkExpiry(value) {
            const expires = VikingPublisher.expiryTimestamp(value);
            if (!Number.isFinite(expires)) return {expired: false, unknown: true, text: VikingPublisher.labels[curLang].unknown};
            const expired = Date.now() >= expires;
            return {expired, unknown: false, text: translations[curLang][expired ? 'expired' : 'valid']};
        }

        function scrollToArticle() {
            if (showGifts) return;
            const target = document.getElementById(VikingPublisher.fragmentId());
            if (target?.matches('#news-grid > article')) {
                const text = target.querySelector('.content-text');
                const more = target.querySelector('button[id^="btn-"]');
                if (more && text?.classList.contains('line-clamp-3') && !more.classList.contains('hidden')) more.click();
                target.scrollIntoView({block:'start'});
            }
        }

        async function loadNews() {
            const request = ++loadVersion;
            try {
                const news = await VikingPublisher.fetchFeed('news.json');
                if (request !== loadVersion) return;
                if (showGifts) {
                    stopGifts?.();
                    stopGifts = VikingPublisher.mountGifts(document.getElementById('gift-board'), news, curLang);
                    return;
                }
                const container = document.getElementById('news-grid');
                container.innerHTML = '';

                if(!news || news.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-500 col-span-full">No news available.</p>';
                    return;
                }

                news.forEach((item, index) => {
                    const data = item[curLang] || item['en'];
                    if (!data) return;

                    const t = translations[curLang];
                    const hasCode = item.code ? true : false;

                    const imgUrl = VikingPublisher.safeUrl(item.image, document.baseURI) || "header-bg.jpg";

                    // Expiry Check
                    let expiryHTML = '';
                    if (hasCode) {
                        const status = checkExpiry(item.expiry);
                        const colorClass = status.unknown ? "text-gray-400" : status.expired ? "text-red-500" : "text-green-500";
                        expiryHTML = `<p class="text-[10px] text-gray-500 mt-2 text-center flex justify-between">
                            <span>${item.expiry ? VikingPublisher.labels[curLang].expires + ' ' + escapeHtml(item.expiry) : ''}</span>
                            <span class="${colorClass} font-bold uppercase">${status.text}</span>
                        </p>`;
                    }

                    const txtId = `txt-${index}`;
                    const btnId = `btn-${index}`;

                    // Text formatieren (Links klickbar machen)
                    const contentHTML = formatText(data.content);

                    const cardHTML = `
                    <article class="glass-card rounded-xl overflow-hidden flex flex-col h-full group relative">
                        <div class="aspect-video w-full overflow-hidden relative border-b border-white/5 bg-black/50 shrink-0">
                            <img src="${escapeHtml(imgUrl)}" alt="" class="w-full h-full object-cover transition duration-700 group-hover:scale-110">
                            <div class="absolute top-3 right-3 bg-black/70 px-2 py-1 rounded text-xs text-[#d4af37] font-bold border border-[#d4af37] font-mono shadow-lg">
                                ${escapeHtml(item.date)}
                            </div>
                        </div>

                        <div class="p-6 flex flex-col flex-1">
                            <h3 class="viking-font text-xl text-white mb-3 leading-tight group-hover:text-[#d4af37] transition-colors">
                                ${escapeHtml(data.title)}
                            </h3>

                            <div class="flex-1 mb-4">
                                <div id="${txtId}" class="text-gray-400 text-sm line-clamp-3 content-text">
                                    ${contentHTML}
                                </div>
                                <button id="${btnId}" onclick="toggleText('${txtId}', '${btnId}')" class="text-xs font-bold text-[#d4af37] hover:text-white border-b border-transparent hover:border-white transition uppercase mt-2 hidden">
                                    ${t.readmore}
                                </button>
                            </div>

                            ${hasCode ? `
                            <div class="mt-auto">
                                <div class="promo-box rounded-lg p-3 flex items-center justify-between gap-2">
                                    <div class="overflow-hidden">
                                        <p class="text-[10px] uppercase text-[#d4af37] tracking-wider font-bold">Promo Code</p>
                                        <p class="font-mono text-white text-lg tracking-widest truncate">${escapeHtml(item.code)}</p>
                                    </div>
                                    <button type="button" data-copy-code aria-label="${escapeHtml(VikingPublisher.labels[curLang].copy)}" class="bg-[#d4af37] hover:bg-white text-black p-2 rounded transition shrink-0 shadow-lg">
                                        <span class="material-symbols-outlined text-lg notranslate">content_copy</span>
                                    </button>
                                </div>
                                ${expiryHTML}
                            </div>
                            ` : ''}
                            <div class="vr-news-share"></div>
                        </div>
                    </article>`;

                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = cardHTML;
                    const cardElement = tempDiv.firstElementChild;
                    if (item.id != null) {
                        cardElement.id = String(item.id);
                        cardElement.querySelector('.vr-news-share').append(
                            VikingPublisher.shareControl('news.html', item.id, curLang)
                        );
                    }
                    const image = cardElement.querySelector('img');
                    image.addEventListener('error', () => { image.src = 'header-bg.jpg'; }, {once:true});
                    const copyButton = cardElement.querySelector('[data-copy-code]');
                    if (copyButton) copyButton.addEventListener('click', () => copyCode(copyButton, String(item.code)));
                    container.appendChild(cardElement);

                    // Check ob "Mehr lesen" nötig ist
                    const txtEl = document.getElementById(txtId);
                    const btnEl = document.getElementById(btnId);

                    if (txtEl && btnEl) {
                        if (txtEl.scrollHeight > txtEl.clientHeight) {
                            btnEl.classList.remove('hidden');
                        }
                    }
                });

                scrollToArticle();
            } catch(e) {
                if (request !== loadVersion) return;
                console.error(e);
                const target = document.getElementById(showGifts ? 'gift-board' : 'news-grid');
                target.innerHTML = '<p class="text-center text-red-500 col-span-full">Error loading news.</p>';
            }
        }

        function toggleText(txtId, btnId) {
            const txt = document.getElementById(txtId);
            const btn = document.getElementById(btnId);
            const t = translations[curLang];

            if (txt.classList.contains('line-clamp-3')) {
                txt.classList.remove('line-clamp-3');
                btn.innerText = t.showless;
            } else {
                txt.classList.add('line-clamp-3');
                btn.innerText = t.readmore;
            }
        }

        async function copyCode(btn, code) {
            try {
                await navigator.clipboard.writeText(code);
            } catch {
                const range = document.createRange();
                range.selectNodeContents(btn.previousElementSibling.querySelector('p:last-child'));
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                return;
            }
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined text-lg notranslate">check</span>`;
            btn.classList.add('bg-green-600', 'text-white');
            btn.classList.remove('bg-[#d4af37]', 'text-black');

            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-green-600', 'text-white');
                btn.classList.add('bg-[#d4af37]', 'text-black');
            }, 2000);
        }

        updateUI();
        loadNews();
        window.addEventListener('hashchange', scrollToArticle);
        window.addEventListener('popstate', () => {
            const lang = new URLSearchParams(location.search).get('lang') || 'en';
            if (lang === curLang || !Object.hasOwn(translations, lang)) return;
            curLang = lang;
            updateUI();
            loadNews();
        });
        VikingPublisher.fetchFeed('patchnotes.json').then(entries => {
            refreshMaintenance = VikingPublisher.mountMaintenance(
                document.getElementById('maintenance-notice'), entries, () => curLang
            );
        }).catch(console.error);
    </script>
</body>
</html>
