<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <meta name="theme-color" content="#11151c">
  <meta name="description" content="Viking Rise events, announcements and promo codes.">
  <meta property="og:title" content="Viking Rise · News">
  <meta property="og:image" content="https://vikingrise1337.github.io/favicon.png">
  <title>Viking Rise · News</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="publisher.css">
  <script defer src="publisher.js"></script>
</head>
<body data-page="news">
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="index.html"><img src="favicon.png" width="32" height="32" alt=""> Viking Rise</a>
      <nav>
        <a href="news.html" data-text="news" aria-current="page">News</a>
        <a href="updates.html" data-text="patch">Patch Notes</a>
      </nav>
      <select id="language" aria-label="Language">
        <option value="en" lang="en">English</option>
        <option value="de" lang="de">Deutsch</option>
        <option value="cn" lang="zh-CN">简体中文</option>
        <option value="ru" lang="ru">Русский</option>
      </select>
    </div>
  </header>
  <main class="wrap">
    <div class="masthead">
      <p class="eyebrow" data-text="journal">Viking Rise Journal</p>
      <h1 data-text="news">News</h1>
      <p data-text="newsSub">Events, announcements and promo codes.</p>
    </div>
    <div class="layout" id="layout" hidden>
      <article id="entry" aria-labelledby="entry-title" tabindex="-1"></article>
      <aside class="archive" aria-labelledby="archive-title">
        <h2 class="archive-title" id="archive-title" data-text="archive">Archive</h2>
        <button class="archive-toggle" type="button" aria-controls="archive-content" aria-expanded="false">
          <span data-text="archive">Archive</span><span aria-hidden="true">⌄</span>
        </button>
        <div id="archive-content">
          <div class="archive-search">
            <label for="search" class="sr-only" data-text="search">Search archive</label>
            <input id="search" type="search" placeholder="Search archive">
          </div>
          <ul id="entries"></ul>
          <p id="results" class="archive-status" role="status"></p>
        </div>
      </aside>
    </div>
    <p id="status" role="status">Loading…</p>
    <noscript>Please enable JavaScript to read the archive.</noscript>
  </main>
  <footer class="wrap footer"><a href="index.html" data-text="home">Back to home</a></footer>
</body>
</html>
