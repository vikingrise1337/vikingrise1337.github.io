<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google" content="notranslate">
    <meta name="theme-color" content="#d4af37">
    <meta name="description" content="Viking Rise calculators for troops, upgrades, equipment, experience, shards and migration.">
    <title>Viking Rise · Tools</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="tools.css?v=2">
    <script type="module" src="tools.js?v=2"></script>
</head>
<body>
    <header class="tools-top">
        <nav class="tools-wrap tools-nav" aria-label="Viking Rise">
            <a href="index.html" id="home-link" class="tools-brand">
                <img src="favicon.png" width="34" height="34" alt="">
                <span>Viking Rise</span>
            </a>
            <label>
                <span class="sr-only" data-text="language">Language</span>
                <select id="tool-language">
                    <option value="en" lang="en">English</option>
                    <option value="de" lang="de">Deutsch</option>
                    <option value="cn" lang="zh-CN">简体中文</option>
                    <option value="ru" lang="ru">Русский</option>
                </select>
            </label>
        </nav>
    </header>
    <div class="tools-hero">
        <div class="tools-wrap">
            <p class="eyebrow">Viking Rise Hub</p>
            <h1 data-text="tools">Player tools</h1>
            <p data-text="intro">Plan troops, upgrades, equipment and gathering with your in-game values.</p>
            <p class="hero-meta" data-text="heroMeta">7 tools · works without a game login</p>
        </div>
    </div>
    <main class="tools-wrap">
        <a class="tool-back" id="tool-back" href="#" data-text="allTools" hidden>← All tools</a>
        <nav class="tool-list" id="tool-list" aria-label="Player tools"></nav>
        <div id="tool-panel"></div>
        <noscript>Enable JavaScript to use the calculators.</noscript>
    </main>
    <footer class="tools-wrap tools-footer" data-text="foot">Unofficial fan tools for Viking Rise.</footer>
</body>
</html>
